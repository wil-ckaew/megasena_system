version: '3.8'

services:
  # Backend Rust
  backend:
    build: ./backend_rust
    container_name: megasena-backend
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHON_ML_SERVICE_URL=http://ia:5000
      - CHATBOT_SERVICE_URL=http://chatbot:8000
    volumes:
      - ./resultados_megasena.csv:/app/resultados_megasena.csv
    networks:
      - megasena-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # IA Python - Serviço ML principal
  ia:
    build: ./ml_service
    container_name: megasena-ia
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - CSV_PATH=/app/resultados_megasena.csv
    volumes:
      - ./ml_service:/app
      - ./resultados_megasena.csv:/app/resultados_megasena.csv
    networks:
      - megasena-network
    command: python api_service.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Chatbot Python - Novo serviço
  chatbot:
    build: 
      context: ./ml_service
      dockerfile: Dockerfile.chatbot
    container_name: megasena-chatbot
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CSV_PATH=/app/resultados_megasena.csv
      - ML_SERVICE_URL=http://ia:5000
    volumes:
      - ./ml_service:/app
      - ./resultados_megasena.csv:/app/resultados_megasena.csv
    networks:
      - megasena-network
    command: python chatbot_service_simple.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js
  frontend:
    build: ./frontend_nextjs
    container_name: megasena-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_CHATBOT_URL: http://chatbot:8000
      NEXT_PUBLIC_ML_URL: http://ia:5000
      HOST: 0.0.0.0
    networks:
      - megasena-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  megasena-network:
    driver: bridge
