services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ckaew
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: backend_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend_rust
      dockerfile: Dockerfile
    container_name: backend_rust
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ckaew:senha123@db:5432/backend_db
    restart: always

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ml_service
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
    restart: always

  frontend:
    build:
      context: ./frontend_nextjs
      dockerfile: Dockerfile
    container_name: frontend_nextjs
    depends_on:
      - backend
      - ml_service
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_ML_API_URL: http://ml_service:5000
    restart: always

volumes:
  pgdata:

