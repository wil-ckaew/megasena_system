version: '3.8'

services:
  # Backend Rust
  backend:
    build: ./backend_rust
    container_name: megasena-backend
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHON_ML_SERVICE_URL=http://ia:5000  # <-- Mudar para nome do serviço
    volumes:
      - ./resultados_megasena.csv:/app/resultados_megasena.csv
    networks:
      - megasena-network
    depends_on:
      - ia  # <-- Garantir que IA inicie primeiro
    restart: unless-stopped

  # IA Python - CORRIGIDO: apontar para ml_service
  ia:
    build: ./ml_service  # <-- Mudar de ia_python para ml_service
    container_name: megasena-ia
    ports:
      - "5000:5000"  # <-- Usar porta 5000 (consistente com seu código)
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - CSV_PATH=/app/resultados_megasena.csv
    volumes:
      - ./resultados_megasena.csv:/app/resultados_megasena.csv
    networks:
      - megasena-network
    restart: unless-stopped

  # Frontend Next.js
  frontend:
    build: ./frontend_nextjs
    container_name: megasena-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8080
      HOST: 0.0.0.0
    stdin_open: true
    tty: true

    networks:
      - megasena-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  megasena-network:
    driver: bridge